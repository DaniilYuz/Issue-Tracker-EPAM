apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-tracker
  namespace: issue-tracker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: issue-tracker
  template:
    metadata:
      labels:
        app: issue-tracker
    spec:
      nodeSelector:
        role: app
      containers:
        - name: issue-tracker
          image: localhost:5050/issue-tracker:latest
          imagePullPolicy: Never
          command: ["./server"]
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_DB
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: issue-tracker
  namespace: issue-tracker
spec:
  selector:
    app: issue-tracker
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051

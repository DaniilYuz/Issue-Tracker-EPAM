syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

package service;

option go_package = "git.epam.com/go-language-global-mentoring-program/pkg/gen;gen";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = {
      post: "/v1/projects"
      body: "*"
    };
  }

  rpc ReadProject(ReadProjectRequest) returns (ReadProjectResponse) {
    option (google.api.http) = {
      get: "/v1/projects/{project_id}"
    };
  }

  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (google.api.http) = {
      put: "/v1/projects/{project.project_id}"
      body: "project"
    };
  }

  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/projects/{project_id}"
    };
  }

  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {
      get: "/v1/projects"
    };
  }
}

message Project {
    string project_id = 1;
    string name = 2;
    string description = 3;
}

message CreateProjectRequest {
    string name = 1;
    string description = 2;
}

message CreateProjectResponse {
    Project project = 1;
}

message ReadProjectRequest {
    string project_id = 1;
}

message ReadProjectResponse {
    Project project = 1;
}

message UpdateProjectRequest {
    Project project = 1;
}

message UpdateProjectResponse {
    Project project = 1;
}

message DeleteProjectRequest {
    string project_id = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
    repeated Project projects = 1;
}

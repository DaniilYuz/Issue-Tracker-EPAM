version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: issue-tracker-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: issue_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issue_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: issue-tracer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  issue-tracker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - SEED_DATABASE=${SEED_DATABASE}
      - STORAGE_TYPE=${STORAGE_TYPE}
      - CACHE_TYPE=${CACHE_TYPE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $${PORT}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  issue-tracker-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["./gateway"]
    env_file:
      - ../.env
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - PORT=${PORT}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - GRPC_HOST=issue-tracker
    depends_on:
      issue-tracker:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
